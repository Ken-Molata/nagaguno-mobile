org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
systemProp.jdk.net.unixdomain.tmpdir=C:\\gradletmp
# Both verified for real against the actual `flutter create` output
# this session, not assumed defaults.
android.useAndroidX=true
android.enableJetifier=true
# Real, confirmed fix for this machine's build environment: the JDK's
# default Unix-domain-socket tmpdir (under the user's long/virtualized
# profile path) made Gradle's daemon IPC pipe fail with "Unable to
# establish loopback connection" / EINVAL on every build -- not a
# flaky or cosmetic issue, this blocked every native Android build
# (flutter build apk/appbundle) all session until root-caused via a
# standalone java.nio.channels.Selector.open() repro. Redirecting the
# JDK's unix-domain-socket directory to a plain, short, non-virtualized
# path resolves it -- confirmed against both a bare JVM repro and the
# real Gradle build.
#
# IMPORTANT, re-confirmed after this stopped working mid-session:
# neither org.gradle.jvmargs nor systemProp.* here actually reaches the
# spawned Gradle daemon's own JVM on this machine -- its startup log
# ("Assuming the daemon was started with following jvm opts: [...]")
# proved the -D flag was silently dropped from both. The systemProp.
# line below is kept only for documentation/Gradle-script visibility;
# the fix that actually works is the JDK_JAVA_OPTIONS environment
# variable (read directly by java.exe itself for every JVM it starts,
# client and daemon alike, bypassing Gradle's own arg-forwarding
# entirely) -- set it before invoking gradlew/flutter build:
#   JDK_JAVA_OPTIONS=-Djdk.net.unixdomain.tmpdir=C:\gradletmp

# .github/workflows/flutter_ci.yml
#
# Both caveats this file used to carry are closed:
# - The six font files blocking a real build were fetched for real
#   from fonts.gstatic.com and committed to assets/fonts/ once this
#   session got real internet access -- see PLATFORM_SETUP.md. A build
#   job is no longer guaranteed to fail on a known, out-of-this-
#   workflow's-control gap, so one is added below.
# - `dart format` has now actually been run against the whole
#   codebase for real (134 of 141 files needed it -- it had never been
#   run before), so the formatting check is a hard gate now, not
#   advisory.
#
# The build job is added on reasoning, not a verified CI run: this
# environment has Flutter and internet access but no Android Studio/
# SDK to actually execute `flutter build apk` against locally (see
# PLATFORM_SETUP.md's "What's actually been done" section) -- ubuntu-
# latest GitHub-hosted runners ship a preinstalled Android SDK/NDK
# (no emulator needed for a plain `--debug` APK build), which is why
# this is expected to work, not confirmed by a real run here.
#
# Still Android-only scope (see PLATFORM_SETUP.md) -- no iOS build job
# exists here either.
#
# Flutter version pinned to 3.41.9 specifically because that's the
# real, actually-installed version reported back this session (not
# a guess) -- see the session notes if you're reading this months
# later and it's worth bumping.

name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # --set-exit-if-changed fails the job if any file isn't
        # correctly formatted, without modifying files in CI. No
        # longer advisory -- the whole codebase is dart-format-clean
        # as of this session's real `dart format .` run.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build_android:
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # satisfies AGP 8.9.1's minimum; VERSION_11 sourceCompatibility in build.gradle still targets 11

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug
